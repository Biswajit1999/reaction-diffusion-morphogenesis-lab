name: Gray-Scott numerical research
on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_gray_scott_robustness.py'
      - '.github/workflows/gray-scott-research.yml'
  workflow_dispatch:
jobs:
  numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pytest==8.2.2
      - run: python -m pytest -q tests/test_gray_scott_robustness.py
      - run: python -m research.run_gray_scott_robustness
      - uses: actions/upload-artifact@v4
        with:
          name: gray-scott-numerical-robustness
          path: results/gray_scott_robustness.json
